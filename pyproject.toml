[project]
name = "ctxfeed"
version = "0.1.0"
description = "Comparative evaluation of context-feeding strategies for LLM-based NL querying over streaming tabular data"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "yfinance>=0.2.31",
    "sentence-transformers>=2.2",
    "streamlit>=1.28",
    "requests>=2.31",
    "scipy>=1.11",
    "matplotlib>=3.7",
    "pyyaml>=6.0",
    "tabulate>=0.9.0",
]

[dependency-groups]
dev = ["pytest>=7.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ctxfeed"]
